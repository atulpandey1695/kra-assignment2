name: CICD Health Dashboard Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build and start services with docker-compose
        run: |
          docker-compose -f docker-compose.yml up -d --build
          echo "Waiting for services to be healthy..."
          sleep 60
          docker ps

      - name: Run health checks
        run: |
          echo "Checking backend health..."
          curl -f http://localhost:5000/health || exit 1

          echo "Checking frontend health..."
          curl -f http://localhost:8080 || exit 1

      - name: Save job status for dashboard
        if: always()
        run: |
          STATUS="SUCCESS"
          if [ "${{ job.status }}" != "success" ]; then STATUS="FAILED"; fi
          
          echo "Recording pipeline status into Postgres (via backend API)..."
          curl -X POST http://localhost:5000/cicd-status \
            -H "Content-Type: application/json" \
            -d "{\"job\":\"cicd-pipeline\",\"status\":\"$STATUS\"}"

      - name: Send Slack notification
        if: always()
        run: |
          STATUS="✅ SUCCESS"
          if [ "${{ job.status }}" != "success" ]; then STATUS="❌ FAILED"; fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"CICD Pipeline run on *${GITHUB_REPOSITORY}* (${GITHUB_REF_NAME}) - $STATUS\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

