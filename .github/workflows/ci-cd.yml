name: CICD Health Dashboard Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Start Docker service
        run: |
          sudo systemctl start docker
          docker --version

      - name: Install docker-compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose

      - name: Build and start services with docker-compose
        run: |
          docker-compose -f docker-compose.yml up -d --build
          echo "Waiting for services to be healthy..."
          sleep 60
          docker ps

      - name: Run health checks
        run: |
          echo "Checking backend health..."
          curl -f http://localhost:5000/health || exit 1
          echo "Checking frontend health..."
          curl -f http://localhost:8080 || exit 1

      - name: Save job status for dashboard
        if: always()
        run: |
          STATUS="SUCCESS"
          if [ "${{ job.status }}" != "success" ]; then STATUS="FAILED"; fi

          echo "Waiting for backend to be ready..."
          for i in {1..10}; do
            if curl -s http://localhost:5000/health >/dev/null; then
              echo "Backend is up!"
              break
            fi
            echo "Retrying in 5s..."
            sleep 5
          done

          echo "Recording pipeline status into Postgres (via backend API)..."
          curl -X POST http://localhost:5000/pipelines/cicd-status \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"cicd-pipeline\",\"status\":\"$STATUS\"}"            

      - name: Install ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update && sudo apt-get install -y ngrok jq

      - name: Expose frontend and backend via ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          nohup ngrok http 8080 --log=stdout > ngrok-frontend.log &
          nohup ngrok http 5000 --log=stdout > ngrok-backend.log &
          sleep 10
          FRONTEND_URL=$(curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[] | select(.config.addr=="http://localhost:8080") | .public_url')
          BACKEND_URL=$(curl --silent http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[] | select(.config.addr=="http://localhost:5000") | .public_url')
          echo "Frontend URL: $FRONTEND_URL"
          echo "Backend URL: $BACKEND_URL"
          echo "FRONTEND_URL=$FRONTEND_URL" >> $GITHUB_ENV
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV

      - name: Add summary with links
        run: |
          {
            echo "## 🚀 CICD Health Dashboard Deployment"
            echo ""
            echo "- **Status**: ${{ job.status }}"
            echo "- 🌐 [Frontend UI](${FRONTEND_URL})"
            echo "- ⚙️ [Backend API](${BACKEND_URL})"
          } >> $GITHUB_STEP_SUMMARY

      - name: Send Slack notification
        if: always()
        run: |
          STATUS="✅ SUCCESS"
          if [ "${{ job.status }}" != "success" ]; then STATUS="❌ FAILED"; fi
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"CICD Pipeline run on *${GITHUB_REPOSITORY}* (${GITHUB_REF_NAME}) - $STATUS\n🌐 Frontend: ${FRONTEND_URL}\n⚙️ Backend: ${BACKEND_URL}\"}" \
            ${{ secrets.SLACK_WEBHOOK_URL }}

