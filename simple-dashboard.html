<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CI/CD Pipeline Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .status-bar {
            background: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .content {
            padding: 30px;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid #007bff;
            transition: transform 0.2s;
        }
        
        .metric-card:hover {
            transform: translateY(-2px);
        }
        
        .metric-title {
            font-size: 0.9rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
        }
        
        .pipelines-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        .pipeline-list {
            display: grid;
            gap: 15px;
        }
        
        .pipeline-item {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #007bff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .pipeline-info h3 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .pipeline-info p {
            color: #6c757d;
            font-size: 0.9rem;
        }
        
        .pipeline-status {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .refresh-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        
        .refresh-btn:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 CI/CD Pipeline Dashboard</h1>
            <p>Real-time monitoring of your build pipelines</p>
        </div>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="connection-status">Connecting...</span>
            </div>
            <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
        </div>
        
        <div class="content">
            <div id="error-message" class="error" style="display: none;"></div>
            
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-title">Total Pipelines</div>
                    <div class="metric-value" id="total-pipelines">-</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Success Rate</div>
                    <div class="metric-value" id="success-rate">-</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Average Build Time</div>
                    <div class="metric-value" id="avg-build-time">-</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Last Build Status</div>
                    <div class="metric-value" id="last-build-status">-</div>
                </div>
            </div>
            
            <div class="pipelines-section">
                <h2 class="section-title">Recent Pipelines</h2>
                <div id="pipelines-list" class="pipeline-list">
                    <div class="loading">Loading pipelines...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000';
        
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                if (response.ok) {
                    document.getElementById('connection-status').textContent = 'Connected';
                    document.getElementById('connection-status').style.color = '#28a745';
                    return true;
                }
            } catch (error) {
                console.error('Health check failed:', error);
            }
            document.getElementById('connection-status').textContent = 'Disconnected';
            document.getElementById('connection-status').style.color = '#dc3545';
            return false;
        }
        
        async function loadPipelines() {
            try {
                const response = await fetch(`${API_BASE}/api/pipelines`);
                const data = await response.json();
                
                const pipelinesList = document.getElementById('pipelines-list');
                pipelinesList.innerHTML = '';
                
                if (data.pipelines && data.pipelines.length > 0) {
                    data.pipelines.forEach(pipeline => {
                        const pipelineElement = document.createElement('div');
                        pipelineElement.className = 'pipeline-item';
                        
                        const statusClass = pipeline.status === 'success' ? 'status-success' : 
                                          pipeline.status === 'failed' ? 'status-failed' : 'status-pending';
                        
                        pipelineElement.innerHTML = `
                            <div class="pipeline-info">
                                <h3>${pipeline.name}</h3>
                                <p>Branch: ${pipeline.branch} | Commit: ${pipeline.commit_hash}</p>
                                <p>Build Time: ${pipeline.build_time || 0}s | Trigger: ${pipeline.trigger_type}</p>
                            </div>
                            <div class="pipeline-status ${statusClass}">${pipeline.status}</div>
                        `;
                        
                        pipelinesList.appendChild(pipelineElement);
                    });
                } else {
                    pipelinesList.innerHTML = '<div class="loading">No pipelines found</div>';
                }
                
                // Update metrics
                document.getElementById('total-pipelines').textContent = data.pipelines ? data.pipelines.length : 0;
                
                if (data.pipelines && data.pipelines.length > 0) {
                    const successCount = data.pipelines.filter(p => p.status === 'success').length;
                    const successRate = Math.round((successCount / data.pipelines.length) * 100);
                    document.getElementById('success-rate').textContent = `${successRate}%`;
                    
                    const avgBuildTime = Math.round(
                        data.pipelines.reduce((sum, p) => sum + (p.build_time || 0), 0) / data.pipelines.length
                    );
                    document.getElementById('avg-build-time').textContent = `${avgBuildTime}s`;
                    
                    const lastPipeline = data.pipelines[0];
                    document.getElementById('last-build-status').textContent = lastPipeline.status;
                }
                
            } catch (error) {
                console.error('Failed to load pipelines:', error);
                document.getElementById('pipelines-list').innerHTML = 
                    '<div class="error">Failed to load pipelines. Please check the backend connection.</div>';
            }
        }
        
        async function loadData() {
            const isHealthy = await checkHealth();
            if (isHealthy) {
                document.getElementById('error-message').style.display = 'none';
                await loadPipelines();
            } else {
                document.getElementById('error-message').style.display = 'block';
                document.getElementById('error-message').textContent = 
                    'Cannot connect to the backend API. Please ensure the backend is running on port 5000.';
            }
        }
        
        // Load data on page load
        loadData();
        
        // Refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
