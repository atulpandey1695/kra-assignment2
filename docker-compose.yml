version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: cicd-postgres
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: atulp
      POSTGRES_PASSWORD: atulp123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atulp -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cicd-network

  redis:
    image: redis:7-alpine
    container_name: cicd-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cicd-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cicd-backend
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=testdb
      - DB_USER=atulp
      - DB_PASSWORD=atulp123
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cicd-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cicd-frontend
    environment:
      - REACT_APP_API_BASE_URL=http://backend:5000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cicd-network        

volumes:
  postgres_data:

networks:
  cicd-network:
    driver: bridge

